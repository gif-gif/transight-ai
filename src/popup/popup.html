<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="popupTitle">Transight AI · Translate on Demand</title><link rel="stylesheet" href="../shared/ui.css"><link rel="stylesheet" href="popup.css"></head>
<body><div class="translation-view">
  <header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true"><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M8 17A7.5 7.5 0 1 1 17 8"/>
  <path d="M9.5 2C5.5 6 5.5 13 9.5 17M9.5 2C11.8 4.3 13 7 13 10M2 9.5h12"/>
  <path d="M12 13h10m-2.5-2.5L22 13l-2.5 2.5M22 20H12m2.5-2.5L12 20l2.5 2.5"/>
</svg></span><div><h1><span data-i18n="brandShort">Transight AI</span><span class="ai">AI</span></h1><small data-i18n="tagline">A little closer. Understand another language, and another way of expressing it.</small></div></div><div class="header-actions"><button id="translation-mode" type="button" class="icon-button mode-button" hidden></button><div class="ui-language-control"><button id="ui-language" class="icon-button" type="button" aria-label="Interface language" data-i18n-aria-label="displayLanguage" title="Interface language" data-i18n-title="displayLanguage" aria-expanded="false" aria-controls="ui-language-menu"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a17 17 0 0 1 0 18 17 17 0 0 1 0-18Z"/></svg></button><div id="ui-language-menu" class="ui-language-menu" hidden role="group" aria-label="Interface language" data-i18n-aria-label="displayLanguage"><button type="button" data-language="auto" aria-pressed="true" data-i18n="followBrowser">Follow browser</button><button type="button" data-language="zh-CN" lang="zh-CN" aria-pressed="false">简体中文</button><button type="button" data-language="zh-TW" lang="zh-TW" aria-pressed="false">繁體中文</button><button type="button" data-language="en" lang="en" aria-pressed="false">English</button><button type="button" data-language="ja" lang="ja" aria-pressed="false">日本語</button><button type="button" data-language="ko" lang="ko" aria-pressed="false">한국어</button></div></div><button id="settings" class="icon-button" aria-label="Open settings" data-i18n-aria-label="openSettings" title="Settings" data-i18n-title="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m9 3-.6 2.3-2 .9-2.2-.6-2 3.4 1.7 1.7v2.6L2.2 15l2 3.4 2.2-.6 2 .9L9 21h4l.6-2.3 2-.9 2.2.6 2-3.4-1.7-1.7v-2.6L19.8 9l-2-3.4-2.2.6-2-.9L13 3Z"/></svg></button><button id="close-view" class="icon-button" hidden type="button" aria-label="Close translation panel" data-i18n-aria-label="closePanel" title="Close (Esc)" data-i18n-title="closeEsc"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></header>
  <main>
    <button class="setup-notice" id="setup" hidden><span data-i18n="setup">Connect your AI service to get started</span><span aria-hidden="true">↗</span></button>
    <div id="inline-unlock" class="inline-unlock" hidden></div>
    <div class="language-row"><label class="sr-only" for="source-language" data-i18n="sourceLanguage">Source language</label><select id="source-language"></select><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h16m-5-5 5 5-5 5"/></svg><label class="sr-only" for="target" data-i18n="targetLanguage">Target language</label><select id="target"></select></div>
    <section class="text-card"><div class="card-head"><label for="source" data-i18n="source">Source</label><button id="clear" class="text-button" type="button" data-i18n="clear">Clear</button></div><div id="source-image-wrap" class="source-image-wrap" hidden><div id="source-images" class="source-images" role="list" aria-label="Attached images" data-i18n-aria-label="attachedImages"></div></div><textarea id="source" maxlength="12000" placeholder="Type or paste text here.
Let language bring you closer." data-i18n-placeholder="sourcePlaceholder" aria-describedby="count" spellcheck="false"></textarea><div class="card-foot"><span data-i18n="pasteImageHint">Paste text or images · Up to 5 images</span><span id="count">0 / 12,000</span></div></section>
    <div class="translation-actions"><button id="translate" class="primary translate-button"><svg id="translate-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4Z"/></svg><span id="translate-label" data-i18n="translate">Translate</span><kbd>⌘ / Ctrl ↵</kbd></button><button id="cancel-translation" type="button" class="secondary" data-i18n="cancelTranslation" hidden>Cancel</button></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="results-list" class="results-list" aria-busy="false"><section class="result-card" aria-busy="false" id="result-card"><div class="card-head"><div class="result-title"><span class="dot"></span><h3 data-i18n="translation">Translation</h3></div><div class="result-actions"><button class="icon-button speak-result" type="button" disabled aria-label="Read translation aloud" title="Read translation aloud"></button><button id="copy" class="icon-button copy-result" type="button" disabled aria-label="Copy translation" title="Copy translation"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button></div></div><div id="result" class="result" aria-live="polite"><div class="empty-state"><span class="empty-glyph" aria-hidden="true">文<span>A</span></span><p data-i18n="emptyTitle">Good translation goes beyond words.</p><small data-i18n="emptyHint">Your AI translation will appear here</small></div></div><div id="result-meta" class="result-meta" hidden></div></section></div>
  </main>
  <footer><span><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg><span data-i18n="privacyHint">Text is sent only when you translate</span></span><span class="version">v0.1.4</span></footer>
  </div>
  <script src="../shared/request-id.js"></script><script src="../shared/speech-client.js"></script>
  <script src="../shared/translation-view.js"></script>
  <script type="module" src="popup.js"></script>
</body></html>
